name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt pytest ruff

      - name: Verify tag matches version metadata
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag -replace '^v', ''
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tags must look like vMAJOR.MINOR.PATCH; got '$tag'."
          }

          $metaVersion = python -c "from joint_axes.meta import APP_VERSION_NUMBER; print(APP_VERSION_NUMBER)"
          $packageVersion = python -c "import joint_axes; print(joint_axes.__version__)"
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"

          if ($tagVersion -ne $metaVersion -or $tagVersion -ne $packageVersion -or $tagVersion -ne $projectVersion) {
              throw "Tag $tag does not match metadata: meta=$metaVersion, package=$packageVersion, pyproject=$projectVersion."
          }

          $versionInfo = Get-Content -Raw "build_assets/version_info.txt"
          $parts = $tagVersion.Split(".")
          $fileVersion = "$tagVersion.0"
          $tuple = "($($parts[0]), $($parts[1]), $($parts[2]), 0)"
          $needles = @(
              "filevers=$tuple",
              "prodvers=$tuple",
              '"FileVersion", "' + $fileVersion + '"',
              '"ProductVersion", "' + $fileVersion + '"'
          )
          foreach ($needle in $needles) {
              if (-not $versionInfo.Contains($needle)) {
                  throw "build_assets/version_info.txt does not contain '$needle'. Bump all version files before tagging."
              }
          }
          Write-Host "Version metadata matches $tag."

      - name: Run tests and linter
        shell: pwsh
        run: |
          python -m pytest
          python -m ruff check .

      - name: Build executable
        shell: pwsh
        run: |
          ./build_exe.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/SAP2000JointAxes.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SAP2000JointAxes.exe" | Set-Content "dist/SAP2000JointAxes.exe.sha256" -Encoding ascii
          Get-Content "dist/SAP2000JointAxes.exe.sha256"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $assets = @(
              "dist/SAP2000JointAxes.exe",
              "dist/SAP2000JointAxes.exe.sha256"
          )
          $title = "SAP2000 Joint Axes $tag"

          gh release create $tag @assets --title $title --generate-notes
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Release already exists or creation failed; uploading assets to the existing release."
              gh release upload $tag @assets --clobber
          }
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed."
          }
